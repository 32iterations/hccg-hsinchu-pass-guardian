name: Performance Monitoring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # Daily at 6 AM

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and serve React application
        run: |
          echo "🚀 Starting React development server..."

          # Use port 3001 as configured in scripts/start.js
          npm start &
          SERVER_PID=$!
          echo "Started development server with PID: $SERVER_PID"
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Give the dev server time to start and install dependencies if needed
          echo "⏳ Waiting for development server to start..."
          sleep 20


      - name: Wait for server to be available
        run: |
          echo "Waiting for server to be available on http://localhost:3001..."
          for i in {1..30}; do
            # Check if the server is responding and has actual React content
            if curl -sSf --connect-timeout 5 --max-time 10 http://localhost:3001 2>/dev/null | grep -q '<div id="root">'; then
              echo "✅ Server is up and React app is loaded!"

              # Also check that JavaScript is being served (not just the shell HTML)
              if curl -sSf http://localhost:3001 2>/dev/null | grep -q '<script'; then
                echo "✅ JavaScript bundle detected!"
                curl -I http://localhost:3001
                exit 0
              else
                echo "⚠️ Server responding but no JavaScript bundle detected yet..."
              fi
            fi
            echo "⏳ Attempt $i/30: Server not ready yet, waiting 3 seconds..."
            sleep 3
          done

          echo "❌ Server never became available after 90 seconds."
          echo "🔍 Checking if server process is still running..."
          if [ ! -z "$SERVER_PID" ]; then
            if ps -p $SERVER_PID > /dev/null; then
              echo "Server process $SERVER_PID is still running"
              echo "🔍 Checking server output..."
              # Try to see if there are any error messages
              ps aux | grep -E "node|npm" | grep -v grep || true
            else
              echo "Server process $SERVER_PID has died"
            fi
          fi
          echo "🔍 Checking what's listening on port 3001..."
          netstat -tlnp | grep :3001 || echo "Nothing listening on port 3001"
          echo "🔍 Testing server response..."
          curl -v http://localhost:3001 2>&1 | head -20 || echo "Could not connect to server"
          exit 1

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          echo "🚀 Starting Lighthouse audit on http://localhost:3001"
          # Create lighthouse config to handle potential issues
          cat > lighthouserc.json << 'EOF'
          {
            "ci": {
              "collect": {
                "url": ["http://localhost:3001"],
                "numberOfRuns": 1,
                "settings": {
                  "chromeFlags": "--no-sandbox --ignore-certificate-errors --disable-dev-shm-usage --disable-gpu --headless",
                  "maxWaitForFcp": 30000,
                  "maxWaitForLoad": 45000
                }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", {"minScore": 0.6}],
                  "categories:accessibility": ["warn", {"minScore": 0.8}],
                  "categories:best-practices": ["warn", {"minScore": 0.8}],
                  "categories:seo": ["warn", {"minScore": 0.8}]
                }
              }
            }
          }
          EOF

          # Test connection one more time before running lighthouse
          if ! curl -sSf http://localhost:3001 > /dev/null; then
            echo "❌ Server is not responding, cannot run Lighthouse"
            exit 1
          fi

          # Ensure the app has JavaScript content loaded
          if ! curl -sSf http://localhost:3001 2>/dev/null | grep -q '<script'; then
            echo "⚠️ Warning: No JavaScript detected in the response. App may not be fully loaded."
            echo "Attempting to continue with Lighthouse audit anyway..."
          fi

          # Run lighthouse with our config
          lhci autorun --config=lighthouserc.json || {
            echo "❌ Lighthouse failed, checking server status..."
            curl -v http://localhost:3001 || echo "Server connection failed"
            echo "🔍 Page content:"
            curl -s http://localhost:3001 | head -50 || echo "Could not fetch page content"
            exit 1
          }

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results-${{ github.sha }}
          path: .lighthouseci/

